<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#171225"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><title>Sprite Lab</title><link rel="stylesheet" href="style.css"></head><body>
<header><input id="nm" value="animation" title="اسم الأنيميشن (اسم الملف)"><select id="pl"></select><span class="sp"></span>
<button id="bo" data-i="open"><span>فتح شيت</span></button><button id="bs" data-i="save"><span>حفظ</span></button><button id="bx" class="a" data-i="down"><span>تصدير الأنيميشن</span></button><button id="bg" data-i="film"><span>GIF</span></button><button id="bp" data-i="image"><span>PNG</span></button><button id="bn" data-i="file"><span>جديد</span></button><input type="file" id="fi" accept="image/*" multiple hidden></header>
<main><section id="vw"><canvas id="cv"></canvas><div id="hud"></div><div class="tb"><button id="un" data-i="undo" title="تراجع"></button><button id="rd" data-i="redo" title="إعادة"></button><button id="pv" data-i="prev" title="السابق"></button><button id="pp" data-i="pause" title="تشغيل/إيقاف"></button><button id="nx" data-i="next" title="التالي"></button><button id="zo" data-i="minus" title="تصغير"></button><button id="zi" data-i="plus" title="تكبير"></button><button id="ft" data-i="fit" title="ملاءمة"></button><button id="z1" title="حجم حقيقي">1:1</button></div><div id="ts"></div></section>
<aside><nav id="tn"><button data-i="film"><small>الفريم</small></button><button data-i="play"><small>التشغيل</small></button><button data-i="grid"><small>الشيتات</small></button><button data-i="eye"><small>العرض</small></button></nav>
<div class="pg" id="p0"><h4>الفريم المحدد <b id="fn"></b></h4><div id="fr"></div>
<h4>تكرار ونسخ</h4><div class="g2"><button id="d1" data-i="copy"><span>نسخ ×1</span></button><button id="d2" data-i="repeat"><span>نسخ ×2</span></button><button id="d4" data-i="repeat"><span>نسخ ×4</span></button></div>
<h4>ترتيب وأدوات</h4><div class="g2"><button id="b1" data-i="left"><span>تقديم</span></button><button id="b2" data-i="right"><span>تأخير</span></button><button id="b4" data-i="trash"><span>حذف</span></button><button id="u1" data-i="scale"><span>توحيد الحجم</span></button><button id="u2" data-i="anchor"><span>محاذاة الأرض</span></button><button id="u0" data-i="reset"><span>ريسيت الفريم</span></button><button id="u3" data-i="reset"><span>ريسيت الكل</span></button></div>
<p class="h">Space تشغيل · [ ] تنقّل · الأسهم تحريك (Shift ×10) · دبل-كليك على اسم أي خاصية = رجوع للافتراضي</p></div>
<div class="pg" id="p1"><div id="eff"></div><div id="pb"></div></div>
<div class="pg" id="p2"><h4>الشيتات المفتوحة</h4><div id="tabs"></div><div class="g2"><button id="bo2" data-i="plus"><span>إضافة شيت</span></button><button id="aa" data-i="film"><span>إضافة كل الشيت</span></button><button id="md" data-i="copy"><span>النقر: إضافة</span></button></div><div id="cells"></div><div id="sh"></div></div>
<div class="pg" id="p3"><div id="vp"></div></div></aside></main>
<footer id="strip"></footer><script src="gif.js"></script><script src="app.js"></script></body></html>
